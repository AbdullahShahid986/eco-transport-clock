
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oslo Digital Clock</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: transparent;
}

.clock {
  width: 100%;
  max-width: 360px;
  height: 235px;
  margin: 0 auto;
  padding: 18px 22px;
  background: #101e2e;
  color: #ffffff;
  border: 1px solid #293b4e;
  border-radius: 22px;
  overflow: hidden;
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid #293747;
}

.icon {
  width: 44px;
  height: 44px;
  border-radius: 15px;
  background: #104f4b;
  color: #56ead5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

.city {
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 3px;
}

.subtitle {
  color: #a9bfd2;
  font-size: 12px;
  margin-top: 4px;
}

.live {
  margin-left: auto;
  color: #56ead5;
  font-size: 11px;
  letter-spacing: 1px;
}

.label {
  text-align: center;
  margin-top: 17px;
  color: #56ead5;
  font-size: 11px;
  letter-spacing: 3px;
}

.time {
  text-align: center;
  margin-top: 7px;
  color: #56ead5;
  font-size: clamp(34px, 9vw, 43px);
  font-weight: bold;
  letter-spacing: -1px;
  white-space: nowrap;
}

.date {
  text-align: center;
  margin-top: 8px;
  font-size: 12px;
}

.zone {
  display: table;
  margin: 12px auto 0;
  padding: 8px 14px;
  border-radius: 20px;
  background: #203449;
  color: #d9e8f5;
  font-size: 11px;
  letter-spacing: 1px;
}
</style>
</head>

<body>
<div class="clock">
  <div class="header">
    <div class="icon">◷</div>
    <div>
      <div class="city">OSLO</div>
      <div class="subtitle">Norway · Digital Clock</div>
    </div>
    <div class="live">● LIVE</div>
  </div>

  <div class="label">OSLO LOCAL TIME</div>
  <div class="time" id="time">00:00:00</div>
  <div class="date" id="date"></div>
  <div class="zone">EUROPE / OSLO</div>
</div>

<script>
function updateClock() {
  const now = new Date();

  document.getElementById("time").textContent =
    new Intl.DateTimeFormat("en-GB", {
      timeZone: "Europe/Oslo",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    }).format(now);

  document.getElementById("date").textContent =
    new Intl.DateTimeFormat("en-GB", {
      timeZone: "Europe/Oslo",
      weekday: "long",
      day: "2-digit",
      month: "long",
      year: "numeric"
    }).format(now);
}

updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
